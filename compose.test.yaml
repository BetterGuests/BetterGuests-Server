name: betterguests-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: betterguests_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_test_admin
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname betterguests_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db:/betterguests/db:ro
